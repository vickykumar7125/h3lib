site_name: h3lib
site_description: H3 geospatial indexing SDK with pluggable stores and optional cache
site_url: https://vickykumar7125.github.io/h3lib/
repo_url: https://github.com/vickykumar7125/h3lib
repo_name: vickykumar7125/h3lib
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guides:
      - Client & configuration: client.md
      - Indexing & modes: indexing.md
      - CRUD: crud.md
      - Hierarchy: hierarchy.md
      - Traversal: traversal.md
      - Measures & GeoJSON: measures.md
      - Spatial queries: queries.md
      - Analytics: analytics.md
      - Stores: stores.md
      - Cache: cache.md
      - Docker backends: docker.md
  - Reference:
      - API overview: api.md
      - Examples: examples.md
  - Project:
      - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vickykumar7125/h3lib
    - icon: fontawesome/brands/python
      link: https://pypi.org/
