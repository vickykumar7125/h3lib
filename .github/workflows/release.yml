name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: h3lib ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            ## h3lib ${{ github.ref_name }}

            Python H3 geospatial indexing SDK with pluggable stores and optional cache.

            ### Install

            ```bash
            pip install https://github.com/vickykumar7125/h3lib/releases/download/${{ github.ref_name }}/h3lib-0.1.0-py3-none-any.whl
            ```

            Or from source:

            ```bash
            pip install git+https://github.com/vickykumar7125/h3lib.git@${{ github.ref_name }}
            ```

            ### Artifacts

            - `h3lib-*-py3-none-any.whl` — wheel
            - `h3lib-*.tar.gz` — source distribution

            Docs: https://github.com/vickykumar7125/h3lib#readme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
