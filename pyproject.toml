[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3lib"
version = "0.1.0"
description = "H3 geospatial indexing SDK with pluggable stores and optional cache"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vicky Kumar" }]
dependencies = [
  "h3>=4.0.0",
  "duckdb>=1.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.0"]
mysql = ["pymysql>=1.1.0"]
mongo = ["pymongo>=4.6.0"]
redis = ["redis>=5.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]
all = [
  "psycopg[binary]>=3.1.0",
  "pymysql>=1.1.0",
  "pymongo>=4.6.0",
  "redis>=5.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/vickykumar7125/h3lib"
Repository = "https://github.com/vickykumar7125/h3lib"
Issues = "https://github.com/vickykumar7125/h3lib/issues"
Documentation = "https://vickykumar7125.github.io/h3lib/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3lib = ["py.typed"]

[tool.pytest.ini_options]
markers = [
  "integration: tests that need external services (Postgres, Redis, MySQL, Mongo)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["h3lib"]
ignore_missing_imports = true
warn_unused_ignores = true
